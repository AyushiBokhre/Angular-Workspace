
<!DOCTYPE html>
<html>
<head>
    <title>Simple Footer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 20px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .footer a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }
    </style>
</head>

<body>

    <footer class="footer">
        <p>© 2026 My Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
