
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        .login {
            border: 1px solid black;
            width: 400px;
            margin: auto;
            padding: 20px;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin: 15px 0;
        }

        label {
            width: 100px;
            text-align: left;
        }

        input {
            padding: 10px;
            flex: 1;
        }

        button {
            padding: 10px 25px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login">

        <h2>Login</h2>
         <h3 style="color: red;">{{form.errorMsg}}</h3>

        <form (submit)="login()">

            <div class="form-group">
                <label for="login">Login:</label>
                <input type="text" id="login" name="login" [(ngModel)]="form.data.login" 
                       placeholder="Enter login" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" [(ngModel)]="form.data.password"
                       placeholder="Enter Password" required>
            </div>

            <button type="submit">Login</button>

        </form>

        <p>Don't have an account? <a href="#">Register</a></p>

    </div>

</body>
</html>
