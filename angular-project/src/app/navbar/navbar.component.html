
<!DOCTYPE html>
<html>
<head>
    <title>Simple Navbar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .navbar {
            background-color: black;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar p {
            color: white;
            margin: 0;
            font-size: 18px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 15px;
            font-size: 18px;
        }

        .navbar a:hover {
            background-color: green;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <p>Hii Guest!</p>

        <div>
            <a href="welcome">Welcome</a>
            <a href="login">Login</a>
            <a href="signup">SignUp</a>
        </div>

    </div>

</body>
</html>
