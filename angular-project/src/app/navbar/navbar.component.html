<!DOCTYPE html>
<html>

<head>
    <title>Simple Navbar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .navbar {
            background-color: black;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar p {
            color: white;
            margin: 0;
            font-size: 18px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 15px;
            font-size: 18px;
        }

        .navbar a:hover {
            background-color: green;
        }
        h2 {
            color: white;
          
        }
    </style>
</head>

<body>

    <div class="navbar">

        <div *ngIf="!isLogin()">

            <h2>Hii, Guest</h2>
            <a href="login">Login</a> |
            <a href="signup">SignUp</a> |
            <a href="welcome">Welcome</a>

        </div>

        <div *ngIf="isLogin()">

            <h2>Hii, {{form.data.firstName}}({{form.data.roleName}})</h2>
            <a (click)="logout()">Logout</a> |
            <a href="role">Add Role</a> |
            <a href="user">Add User</a> |
            <a href="#">Role List</a> |
            <a href="welcome">Welcome</a> |

        </div>
        <hr>

    </div>

</body>

</html>
