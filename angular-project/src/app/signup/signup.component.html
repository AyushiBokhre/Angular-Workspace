
<!DOCTYPE html>
<html>
<head>
    <title>Signup Page</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        .signup {
            border: 1px solid black;
            width: 450px;
            margin: auto;
            padding: 20px;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin: 12px 0;
        }

        label {
            width: 150px;
            text-align: left;
        }

        input {
            padding: 10px;
            flex: 1;
            min-width: 0;
        }

        button {
            padding: 10px 25px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="signup">

        <h2>Signup</h2>
         <h3 style="color: red;">{{form.errorMsg}}</h3>
          <h3 style="color: green;">{{form.successMsg}}</h3>

        <form (submit)="signup()">

            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" name="firstName" [(ngModel)]="form.data.firstName"
                       placeholder="Enter First Name" required>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" name="lastName" [(ngModel)]="form.data.lastName"
                       placeholder="Enter Last Name" required>
            </div>

            <div class="form-group">
                <label for="login">Login:</label>
                <input type="text" id="login" name="login" [(ngModel)]="form.data.login"
                       placeholder="Enter Login" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" [(ngModel)]="form.data.password"
                       placeholder="Enter Password" required>
            </div>

            <button type="submit">Register</button>

        </form>

        <p>Already have an account? <a href="#">Login</a></p>

    </div>

</body>
</html>
