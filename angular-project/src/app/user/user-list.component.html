<div>
    <h1 align="center">User List</h1>
    <table width="100%" border="1" align="center" mt-5 >
        <thead align="center" bgcolor="grey">
            <tr>
                <th>Id</th>
                <th>Profile</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Login</th>
                <th>Role</th>
            </tr>
        </thead>
        <tbody align="center">
            <tr *ngFor="let user of form.list">
                <td>{{ user.id }}</td>
                <img [src]="'http://localhost:8080/User/profilePic/' + user.id" width="50" height="50"/>
                <td>{{ user.firstName }}</td>
                <td>{{ user.lastName }}</td>
                <td>{{ user.login }}</td>
                <td>{{ user.roleName }}</td>
            </tr>
        </tbody>
        </table>
</div>
